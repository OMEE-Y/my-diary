<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <title>{{ page.title }} | Om's Diary</title>

  <meta
    name="description"
    content="Om's personal blog and online diary"
  >

  <meta name="author" content="Om Yewale">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <link
    rel="stylesheet"
    href="{{ get_url(path='css/diary.css') }}"
  >

  <link
    rel="icon"
    type="image/png"
    href="{{ get_url(path='favicon.ico') }}"
  >
</head>

<body>

  <header>

    <div class="topbar">

      <h2>
        <a href="{{ get_url(path='') }}">
          om's diary
        </a>
      </h2>

      <div class="actions">

        <a
          class="home-button"
          href="https://omeey.vercel.app"
        >
          Home
        </a>

        <button
          id="theme-toggle"
          class="theme-toggle"
          type="button"
        >
          Dark Mode
        </button>

      </div>

    </div>

    <hr>

  </header>


  <main class="single-post">

    <article>

      <h1>
        {{ page.title }}
      </h1>

      {% if page.date %}
        <p class="post-date">
          {{ page.date | date(format="%b %d, %Y") }}
        </p>
      {% endif %}

      <div class="post-content">

        {{ page.content | safe }}

      </div>

    </article>

  </main>


  <footer>

    <a href="{{ get_url(path='') }}">
      ← Back to writing
    </a>

  </footer>


  <script>

    const themeToggle =
      document.getElementById("theme-toggle");

    function updateThemeButton() {

      const isDark =
        document.documentElement
          .getAttribute("data-theme") === "dark";

      themeToggle.textContent =
        isDark
          ? "Light Mode"
          : "Dark Mode";
    }


    const savedTheme =
      localStorage.getItem("theme");

    if (savedTheme === "dark") {

      document.documentElement
        .setAttribute(
          "data-theme",
          "dark"
        );
    }


    themeToggle.addEventListener(
      "click",
      function () {

        const isDark =
          document.documentElement
            .getAttribute("data-theme") === "dark";


        if (isDark) {

          document.documentElement
            .removeAttribute("data-theme");

          localStorage.setItem(
            "theme",
            "light"
          );

        } else {

          document.documentElement
            .setAttribute(
              "data-theme",
              "dark"
            );

          localStorage.setItem(
            "theme",
            "dark"
          );
        }

        updateThemeButton();

      }
    );


    updateThemeButton();

  </script>

</body>
</html>
