<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="utf-8">

  <title>
    {{ section.title }} | Om's Diary
  </title>

  <meta
    name="description"
    content="Om's personal blog and online diary"
  >

  <meta
    name="author"
    content="Om Yewale"
  >

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <link
    rel="stylesheet"
    href="{{ get_url(path='css/diary.css') }}"
  >

  <link
    rel="icon"
    type="image/png"
    href="{{ get_url(path='favicon.ico') }}"
  >

  <script>

    (function () {

      const savedTheme =
        localStorage.getItem("theme");

      if (savedTheme === "dark") {

        document.documentElement
          .setAttribute(
            "data-theme",
            "dark"
          );
      }

    })();

  </script>

</head>


<body>


<header>

  <div class="topbar">

    <h2>
      # {{ section.title }}
    </h2>

    <div class="actions">

      <a
        class="home-button"
        href="https://omeey.vercel.app"
      >
        Home
      </a>

      <button
        id="theme-toggle"
        class="theme-toggle"
        type="button"
      >
        Dark Mode
      </button>

    </div>

  </div>

  <hr>

</header>


<main class="posts">

  {% for page in paginator.pages %}

    <article class="post-card">

      <a
        href="{{ page.permalink }}"
        class="post-card-link"
      >

        <div class="post-icon">
          📄
        </div>

        <div class="post-info">

          <h3>
            {{ page.title }}
          </h3>

          {% if page.date %}
            <p>
              {{ page.date | date(format="%b %d, %Y") }}
            </p>
          {% endif %}

        </div>

      </a>

    </article>

  {% endfor %}

</main>


<nav class="pagination">

  {% if paginator.previous %}

    <a
      class="previous"
      href="{{ paginator.previous }}"
    >
      ‹ Prev
    </a>

  {% endif %}


  {% if paginator.next %}

    <a
      class="next"
      href="{{ paginator.next }}"
    >
      Next ›
    </a>

  {% endif %}

</nav>


<script>

  const themeToggle =
    document.getElementById("theme-toggle");


  function updateThemeButton() {

    const isDark =
      document.documentElement
        .getAttribute("data-theme") === "dark";

    themeToggle.textContent =
      isDark
        ? "Light Mode"
        : "Dark Mode";

  }


  themeToggle.addEventListener(
    "click",
    function () {

      const isDark =
        document.documentElement
          .getAttribute("data-theme") === "dark";


      if (isDark) {

        document.documentElement
          .removeAttribute(
            "data-theme"
          );

        localStorage.setItem(
          "theme",
          "light"
        );

      } else {

        document.documentElement
          .setAttribute(
            "data-theme",
            "dark"
          );

        localStorage.setItem(
          "theme",
          "dark"
        );

      }

      updateThemeButton();

    }
  );


  updateThemeButton();

</script>


</body>
</html>
